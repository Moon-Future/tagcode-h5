server {
    listen 80;
    server_name tag.itchensi.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tag.itchensi.com;

    ssl_certificate     /etc/nginx/ssl/itchensi.com.pem;
    ssl_certificate_key /etc/nginx/ssl/itchensi.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;

    root /usr/project/tagcode-h5/dist;
    index index.html;

    access_log /var/log/nginx/tag.itchensi.com.access.log;
    error_log  /var/log/nginx/tag.itchensi.com.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ /\. {
        deny all;
    }
}
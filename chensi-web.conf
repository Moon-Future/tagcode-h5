server {
    listen 443 ssl;
    server_name itchensi.com;

    ssl_certificate      /etc/nginx/ssl/www.itchensi.com.pem;
    ssl_certificate_key  /etc/nginx/ssl/www.itchensi.com.key;

    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/project/chensi-web;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    access_log /var/log/nginx/itchensi.access.log;
    error_log  /var/log/nginx/itchensi.error.log;
}

server {
    listen 443 ssl;
    server_name www.itchensi.com;

    ssl_certificate      /etc/nginx/ssl/itchensi.com.pem;
    ssl_certificate_key  /etc/nginx/ssl/itchensi.com.key;

    return 301 https://itchensi.com$request_uri;
}

server {
    listen 80;
    server_name itchensi.com www.itchensi.com;

    return 301 https://itchensi.com$request_uri;
}